<mat-toolbar color="primary">
  <span>Usuarios</span>
  <span class="spacer"></span>
  <button mat-raised-button color="accent" (click)="abrirFormulario()">
    <mat-icon>person_add</mat-icon> Nuevo usuario
  </button>
</mat-toolbar>

<div class="loading" *ngIf="cargando">
  <mat-spinner diameter="40"></mat-spinner>
</div>

<table mat-table [dataSource]="usuarios" *ngIf="!cargando" class="mat-elevation-z2">
  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef>Usuario</th>
    <td mat-cell *matCellDef="let u">{{ u.username }}</td>
  </ng-container>

  <ng-container matColumnDef="roles">
    <th mat-header-cell *matHeaderCellDef>Roles</th>
    <td mat-cell *matCellDef="let u">
      <mat-chip-set>
        <mat-chip
          *ngFor="let rol of u.roles"
          [color]="rol === rolAdmin ? 'accent' : 'primary'"
          highlighted>
          {{ getRolLabel(rol) }}
        </mat-chip>
      </mat-chip-set>
    </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let u">
      <button mat-icon-button color="primary" matTooltip="Editar" (click)="abrirFormulario(u)">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="eliminar(u)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
</table>

<p *ngIf="!cargando && usuarios.length === 0" class="sin-datos">
  No se encontraron usuarios registrados.
</p>
