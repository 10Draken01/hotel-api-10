<h2 mat-dialog-title>{{ esEdicion ? 'Editar' : 'Nuevo' }} usuario</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre de usuario</mat-label>
      <input matInput formControlName="username">
      <mat-error *ngIf="form.get('username')?.hasError('required')">
        El nombre de usuario es requerido
      </mat-error>
      <mat-error *ngIf="form.get('username')?.hasError('minlength') || form.get('username')?.hasError('maxlength')">
        El usuario debe tener entre 3 y 30 caracteres
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" *ngIf="!esEdicion">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="password">
      <mat-error *ngIf="form.get('password')?.hasError('required')">
        La contraseña es requerida
      </mat-error>
      <mat-error *ngIf="form.get('password')?.hasError('minlength')">
        La contraseña debe tener mínimo 6 caracteres
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Roles</mat-label>
      <mat-select formControlName="roles" multiple>
        <mat-option *ngFor="let rol of rolesCatalogo" [value]="rol.id">
          {{ rol.label }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('roles')?.hasError('required')">
        Debe seleccionar al menos un rol
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="guardando">
      {{ guardando ? 'Guardando...' : 'Guardar' }}
    </button>
  </mat-dialog-actions>
</form>
