spring.application.name=habitaciones

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URI}

server.foward-headers-strategy=framework

server.port=${PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

base.url=${BASE_URL}
gateway.url=${GATEWAY_URL}

# ddl -> data definition lenguage
# para definir como es el comportamiento
# create, create_drop, update, validate, none
spring.jpa.hibernate.ddl-auto=validate

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.config-url=../v3/api-docs/swagger-config
springdoc.swagger-ui.url=../v3/api-docs
