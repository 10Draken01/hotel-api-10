spring.application.name=eureka

server.port=8761

# Para que el servidor eureka no se registre a si mismo como cliente
eureka.client.register-with-eureka=false
# Para que no vacie los registros de los clientes al iniciar
eureka.client.fetch-registry=false
# Para que los clientes se registren con su dirección IP en lugar de su nombre de host
eureka.instance.prefer-ip-address=true
